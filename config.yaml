newsletter_name: ArbRadar
tagline: News and developments in international arbitration
timezone: Asia/Yerevan
# Public base URL of the article site (GitHub Pages or caselens.tech). Leave empty until hosted.
site_url: "https://arbradar.caselens.tech"            # e.g. https://arbradar.caselens.tech once DNS points at the site; enables deep links from the email
signup_url: ""          # form action of your list provider, e.g. https://buttondown.com/api/emails/embed-subscribe/arbradar
signup_field: email     # the field name that provider expects (Buttondown: email; Kit: email_address)
signup_email: aram@caselens.tech   # until signup_url is set, the subscribe box sends requests to this address
mark_url: https://raw.githubusercontent.com/kuatemoc-creator/arbradar/gh-pages/caselens-mark.png   # the mark in the email until the site is live

lookback_days: 7
max_items_per_issue: 12
min_score: 20
min_story_score: 65     # a story needs this much to be printed; a quiet day is short rather than padded

# Watchlists. The number is added to a multiplier, so 0.5 means "half again as
# interesting". Tune these - they are the difference between a generic digest
# and one aimed at your practice.
states:
  Armenia: 1.2
  Azerbaijan: 0.9
  Georgia: 0.8
  Kazakhstan: 0.7
  Uzbekistan: 0.6
  Turkmenistan: 0.6
  Ukraine: 0.5
  Russia: 0.5
  Turkey: 0.4
  Türkiye: 0.4

sectors:
  Mining & metals: 0.5
  Oil & gas: 0.4
  Power & renewables: 0.4
  Construction: 0.3

companies: {}

firms: {}

