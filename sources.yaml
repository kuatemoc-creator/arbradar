not_available:
- italaw.com - Cloudflare 403
- UNCTAD ISDS Navigator - Cloudflare 403
- PCA case list - client-rendered, no REST route for cases
- BAILII recent-decisions feed - no arbitration signal (3 hits in 1,869 entries)
- Swiss Federal Supreme Court 4A_ search - blocked to non-browser clients
- LSE RNS / Investegate / ASX - no keyword feed; announcements reach us via wires and Google News
- Ukraine register of court decisions (reyestr.court.gov.ua) - bot challenge
- Hong Kong Legal Reference System - frameset with POST search and no feed; HKLII is client-rendered
- Australia - Federal Court judgments site, AustLII and Queensland caselaw refuse scripts; NSW Caselaw has no feed
- India - Indian Kanoon refuses scripts; Supreme Court and Delhi High Court sites are client-rendered
- France - Judilibre needs a PISTE account (can be added with a key)
- Cayman Islands judgments - subscription only
- Brazil STJ, Pakistan Supreme Court, Ghana (GhaLII) - refuse scripts
- Ireland courts.ie search, Qatar QICDRC judgments, New Zealand judgments - client-rendered
