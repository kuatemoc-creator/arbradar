apis:
  icsid:
    enabled: true
    what: ICSID docket - every pending and concluded case with counsel, tribunal, treaty and last procedural step
    endpoint: https://icsid.worldbank.org/api/cases/{pending|concluded}
  edgar:
    enabled: true
    what: SEC full-text search of 8-K/6-K/10-Q/10-K/20-F for dispute language (exhibit clauses excluded)
    endpoint: https://efts.sec.gov/LATEST/search-index
  courtlistener:
    enabled: true
    what: US federal dockets - s.1782 applications, petitions to confirm/enforce/vacate, FSIA actions against States
    endpoint: https://www.courtlistener.com/api/rest/v4/search/
    note: set COURTLISTENER_TOKEN in the environment for a higher rate limit
  tenders:
    enabled: true
    what: States and state enterprises procuring arbitration counsel - TED (EU) and Prozorro (Ukraine)
    endpoints:
    - https://api.ted.europa.eu/v3/notices/search
    - https://prozorro.gov.ua/api/search/tenders
  gdelt:
    enabled: true
    what: global news with country tagging, non-English press; throttled to one request per 5 s
    endpoint: https://api.gdeltproject.org/api/v2/doc/doc
  registers:
    enabled: true
    what: government ISDS registers - notices of intent and cases published by Canada (GAC) and the United States (State Dept L/CID)
    endpoints:
    - https://www.international.gc.ca/trade-agreements-accords-commerciaux/topics-domaines/disp-diff/gov.aspx?lang=eng
    - https://www.state.gov/office-of-international-claims-and-investment-disputes/usmca-investor-state-arbitrations
    - https://www.state.gov/nafta-investor-state-arbitrations
    note: Mexico's Secretaría de Economía register (gob.mx) sits behind a bot challenge; its press is covered by the Google News sweep
  pca:
    enabled: true
    what: PCA news page (the case list itself is client-rendered and not available)
    endpoint: https://pca-cpa.org/en/news/
google_news:
  enabled: true
  editions: []
